name: Build YT Pulse

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check repository
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== CLIENT ==="
          ls -la client

      - name: Install client dependencies
        working-directory: ./client
        run: npm install

      - name: Build client
        working-directory: ./client
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: yt-pulse-web
          path: client/dist
          if-no-files-found: error
